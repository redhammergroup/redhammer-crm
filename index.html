<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Red Hammer CRM</title>
<meta name="theme-color" content="#2A2A28">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Red Hammer">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: phone-first job app. Charcoal top bar + trade switcher, one working view, fixed bottom nav; job opens as a full-screen sheet. */
:root{
  --bg:#F5F1EA; --surface:#FFFDF9; --sunk:#ECE6DB; --line:#DCD4C6; --ink:#2A2A28; --muted:#6B675F;
  --red:#A8201E; --red-deep:#8C1D1D; --red-tint:rgba(168,32,30,.09);
  --bar:#2A2A28; --bar-ink:#F5F1EA; --bar-muted:#B9B2A5;
  --good:#2E7A4C; --good-tint:rgba(46,122,76,.12); --warn:#A86A12; --warn-tint:rgba(168,106,18,.13);
  --built:#1F5F8B; --a15:#8A6D00; --a15-t:rgba(200,160,0,.18); --a30:#B8500A; --a30-t:rgba(214,110,20,.16); --a60:#A8201E; --a60-t:rgba(168,32,30,.13);
  --p-re:#A86A12; --p-re-t:rgba(168,106,18,.14); --p-ap:#2A5CA6; --p-ap-t:rgba(42,92,166,.12); --p-pa:#7B3D9C; --p-pa-t:rgba(123,61,156,.12);
  --shadow:0 1px 2px rgba(42,42,40,.08),0 2px 8px rgba(42,42,40,.06);
  --f-display:"Barlow Condensed","Arial Narrow",Calibri,sans-serif;
  --f-body:Calibri,Carlito,"Barlow","Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1B1B19; --surface:#252523; --sunk:#141412; --line:#3A3935; --ink:#EEE9DF; --muted:#A49E93;
  --red:#D4463E; --red-deep:#B8322B; --red-tint:rgba(212,70,62,.16);
  --bar:#111110; --bar-ink:#F5F1EA; --bar-muted:#9C968B;
  --good:#5DB47E; --good-tint:rgba(93,180,126,.16); --warn:#E0A43E; --warn-tint:rgba(224,164,62,.16);
  --built:#5AA7DB; --a15:#E6C84A; --a15-t:rgba(230,200,74,.18); --a30:#F0924E; --a30-t:rgba(240,146,78,.18); --a60:#F07A70; --a60-t:rgba(240,122,112,.18);
  --p-re:#E0A43E; --p-re-t:rgba(224,164,62,.18); --p-ap:#7FA7EC; --p-ap-t:rgba(127,167,236,.18); --p-pa:#C993E6; --p-pa-t:rgba(201,147,230,.18);
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1B19; --surface:#252523; --sunk:#141412; --line:#3A3935; --ink:#EEE9DF; --muted:#A49E93;
  --red:#D4463E; --red-deep:#B8322B; --red-tint:rgba(212,70,62,.16);
  --bar:#111110; --bar-ink:#F5F1EA; --bar-muted:#9C968B;
  --good:#5DB47E; --good-tint:rgba(93,180,126,.16); --warn:#E0A43E; --warn-tint:rgba(224,164,62,.16);
  --built:#5AA7DB; --a15:#E6C84A; --a15-t:rgba(230,200,74,.18); --a30:#F0924E; --a30-t:rgba(240,146,78,.18); --a60:#F07A70; --a60-t:rgba(240,122,112,.18);
  --p-re:#E0A43E; --p-re-t:rgba(224,164,62,.18); --p-ap:#7FA7EC; --p-ap-t:rgba(127,167,236,.18); --p-pa:#C993E6; --p-pa-t:rgba(201,147,230,.18);
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink);padding:10px 16px 0}
.brand{display:flex;align-items:center;gap:10px;min-height:36px}
.mark{width:22px;height:22px;background:var(--red);border-radius:4px;position:relative;flex:none}
.mark::after{content:"";position:absolute;left:5px;top:5px;width:12px;height:4px;background:var(--bar-ink);border-radius:1px;box-shadow:4px 4px 0 -0px transparent}
.mark::before{content:"";position:absolute;left:9px;top:8px;width:4px;height:10px;background:var(--bar-ink);border-radius:1px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.06em;text-transform:uppercase;margin:0}
.brand h1 span{color:var(--bar-muted);font-weight:500}
.sync{margin-left:auto;font-size:12px;color:var(--bar-muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--bar-muted)}
.dot.ok{background:#5DB47E}.dot.bad{background:#E0A43E}
.trades{display:flex;gap:4px;margin-top:8px}
.trades button{flex:1;background:none;border:0;color:var(--bar-muted);font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.08em;text-transform:uppercase;padding:10px 4px 11px;border-bottom:3px solid transparent}
.trades button[aria-pressed="true"]{color:var(--bar-ink);border-bottom-color:var(--red)}
.viewtitle{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase;padding:12px 0 13px;margin:0}

main{padding:14px 16px calc(90px + env(safe-area-inset-bottom,0px))}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,84%);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 8px;align-items:start}
@media (min-width:760px){.board{grid-auto-columns:272px}}
.col{scroll-snap-align:start;background:var(--sunk);border-radius:var(--r);padding:8px;min-height:120px;display:flex;flex-direction:column;gap:8px}
.col.over{outline:2px dashed var(--red);outline-offset:-2px}
.colhead{display:flex;align-items:baseline;gap:8px;padding:4px 4px 2px}
.colhead h2{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;margin:0}
.colhead .ct{font-size:13px;color:var(--muted)}
.colhead .sum{margin-left:auto;font-size:13px;color:var(--muted)}
.empty-col{font-size:13px;color:var(--muted);padding:10px 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;box-shadow:var(--shadow);cursor:pointer;display:grid;gap:4px;text-align:left;width:100%}
.card:hover{border-color:var(--muted)}
.card .nm{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.card .ad{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:2px}
.pill{font-size:12px;line-height:1;padding:4px 7px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.stale{background:var(--warn-tint);color:var(--warn);font-weight:600}
.pill.fresh{background:var(--good-tint);color:var(--good)}
.pill.partner{background:var(--red-tint);color:var(--red)}
.pill.path{font-weight:700;border:1px solid currentColor}
.path-Reinspection{color:var(--p-re);background:var(--p-re-t)}
.path-Appraisal{color:var(--p-ap);background:var(--p-ap-t)}
.path-PA{color:var(--p-pa);background:var(--p-pa-t)}
.chip.pathchip[aria-pressed="true"].path-Reinspection{background:var(--p-re);border-color:var(--p-re);color:var(--surface)}
.chip.pathchip[aria-pressed="true"].path-Appraisal{background:var(--p-ap);border-color:var(--p-ap);color:var(--surface)}
.chip.pathchip[aria-pressed="true"].path-PA{background:var(--p-pa);border-color:var(--p-pa);color:var(--surface)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.filebtn{position:relative;overflow:hidden}
.filebtn input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:200px}
.pill.age15{background:var(--a15-t);color:var(--a15);font-weight:700}
.pill.age30{background:var(--a30-t);color:var(--a30);font-weight:700}
.pill.age60{background:var(--a60-t);color:var(--a60);font-weight:700}
.pill.attn{background:var(--a60);color:#fff;font-weight:700;letter-spacing:.02em}
.card.attn15{box-shadow:inset 4px 0 0 var(--a15),var(--shadow)}
.card.attn30{box-shadow:inset 4px 0 0 var(--a30),var(--shadow)}
.card.attn60{box-shadow:inset 4px 0 0 var(--a60),var(--shadow)}
.searchbar{display:flex;gap:8px;margin-bottom:12px}
.searchbar input{flex:1}
.attnbox{border:1px solid var(--line);border-left:4px solid var(--a60);background:var(--surface);border-radius:var(--r);padding:10px 12px;margin-bottom:12px}
.attnbox summary{cursor:pointer;font-weight:700;display:flex;align-items:center;gap:8px;list-style:none}
.attnbox summary::-webkit-details-marker{display:none}
.attnbox .li{padding:8px 0}
.tbadge{display:inline-block;min-width:18px;padding:1px 5px;margin-left:5px;border-radius:99px;background:var(--red);color:#fff;font-size:11px;letter-spacing:0;vertical-align:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mchart{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;height:150px;align-items:end;padding-top:18px}
.mcol{position:relative;height:100%;display:grid;grid-template-rows:16px 1fr 16px;justify-items:center;outline:none}
.mcol .mval{font-size:10.5px;color:var(--muted);white-space:nowrap;align-self:end}
.mcol .mbar{align-self:end;width:min(70%,26px);background:var(--red);border-radius:4px 4px 0 0;opacity:.85}
.mcol .mlab{font-size:12px;color:var(--muted)}
.mcol.cur .mlab{color:var(--ink);font-weight:700}
.mcol:hover .mbar,.mcol:focus .mbar{opacity:1}
.mcol:hover::after,.mcol:focus::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:3;pointer-events:none}
.mcol:first-child:hover::after,.mcol:first-child:focus::after{left:0;transform:none}
.mcol:last-child:hover::after,.mcol:last-child:focus::after{left:auto;right:0;transform:none}
.bar:focus{outline:none}.bar:focus .fill,.bar:hover .fill{background:var(--red-deep)}
.cam{position:fixed;inset:0;z-index:90;background:#000;display:flex;flex-direction:column}
.cam video{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
.camhint{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;color:#fff;font-size:14px;text-shadow:0 1px 3px #000;pointer-events:none}
.camctl{display:flex;align-items:center;justify-content:space-between;padding:16px 20px calc(20px + env(safe-area-inset-bottom,0px));background:#000}
.camctl .btn{background:#222;color:#fff;border-color:#444;width:84px;justify-content:center}
.shutter{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:var(--red);box-shadow:0 0 0 3px #000 inset}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pill.built{background:var(--built);color:#fff;font-weight:700;letter-spacing:.02em}
.card.builtc{box-shadow:inset 4px 0 0 var(--built),var(--shadow);border-color:var(--built)}
.pill.signed{background:var(--good);color:#fff;font-weight:700;letter-spacing:.02em}
.card.signedc{box-shadow:inset 4px 0 0 var(--good),var(--shadow);border-color:var(--good)}
.dropzone{border:2px dashed var(--line);border-radius:var(--r);padding:22px 14px;display:grid;justify-items:center;gap:4px;text-align:center;background:var(--sunk)}
.dropzone.over{border-color:var(--red);background:var(--red-tint)}
.face{font-size:13px;line-height:1.3;color:var(--ink);background:var(--sunk);border-radius:6px;padding:4px 7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.face::before{content:"📝 "}
.legend{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.card .amt{margin-left:auto;font-weight:600;font-size:14px}
.card.stale{box-shadow:inset 3px 0 0 var(--warn),var(--shadow)}

.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:25;width:56px;height:56px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:30px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.fab:hover{background:var(--red-deep)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;background:none;border:0;padding:8px 0 9px;display:grid;justify-items:center;gap:2px;font-size:12px;color:var(--muted)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--red);font-weight:600}

/* generic */
.banner{background:var(--warn-tint);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.label{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h3.sec{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;margin:0;display:flex;align-items:center;gap:8px}
h3.sec .r{margin-left:auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);min-height:44px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--red-deep)}
.btn.ghost{border-color:transparent;background:none}
.btn.small{min-height:34px;padding:6px 10px;font-size:14px}
.btn.danger{color:var(--red)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.block{width:100%;justify-content:center}
.field{display:grid;gap:4px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;min-height:44px;font-size:16px}
textarea.input{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 12px;font-size:14px;min-height:38px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.list{display:grid}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;overflow-wrap:anywhere}
.li .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.thumb{width:48px;height:48px;border-radius:6px;object-fit:cover;background:var(--sunk);flex:none;display:grid;place-items:center;font-size:11px;color:var(--muted);border:1px solid var(--line)}
.tag{font-size:12px;padding:2px 7px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.tag.ok{background:var(--good-tint);color:var(--good)}
.tag.bad{background:var(--warn-tint);color:var(--warn)}
.tot{display:flex;justify-content:space-between;padding-top:10px;border-top:1px solid var(--line);font-weight:600}
.emptybox{text-align:center;padding:36px 16px;color:var(--muted)}
.emptybox b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

/* job sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.sheethead{position:sticky;top:0;z-index:2;background:var(--bar);color:var(--bar-ink);padding:8px 8px 0}
.sheethead .rowtop{display:flex;align-items:center;gap:6px}
.sheethead .back{background:none;border:0;color:var(--bar-ink);font-size:15px;padding:10px 10px;display:flex;align-items:center;gap:4px}
.sheethead .jn{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.04em;text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheethead .tr{margin-left:auto;margin-right:8px;font-size:12px;color:var(--bar-muted);text-transform:uppercase;letter-spacing:.1em}
.hero{padding:6px 12px 14px;display:grid;gap:10px}
.hero .big{display:flex;align-items:baseline;gap:10px}
.hero .big .v{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1}
.hero .big .v.neg{color:#F08A7F}
.hero .big .k{font-size:13px;color:var(--bar-muted);text-transform:uppercase;letter-spacing:.1em}
.hero .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero .kv div{display:grid}
.hero .kv span{font-size:12px;color:var(--bar-muted);text-transform:uppercase;letter-spacing:.08em}
.hero .kv b{font-size:17px}
.jtabs{display:flex;border-top:1px solid rgba(255,255,255,.08)}
.jtabs button{flex:1;background:none;border:0;color:var(--bar-muted);font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;padding:11px 4px;border-bottom:3px solid transparent}
.jtabs button[aria-pressed="true"]{color:var(--bar-ink);border-bottom-color:var(--red)}
.sheetbody{padding:14px 16px 40px;display:grid;gap:12px;max-width:760px;margin:0 auto}
.stages{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.stages .chip{flex:none}
.contact{display:grid;gap:8px}
.cline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cline .val{flex:1;min-width:140px;font-size:17px;font-weight:600;overflow-wrap:anywhere;user-select:text}
.log .li .ic{width:30px;height:30px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;flex:none;font-size:13px;font-weight:700;color:var(--muted)}
.log .li .ic.call{background:var(--good-tint);color:var(--good)}
.log .li .ic.stage{background:var(--red-tint);color:var(--red)}
.log .li{align-items:flex-start}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(20,20,18,.5);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){.modal{align-items:center}}
.mbox{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow-y:auto;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
@media (min-width:640px){.mbox{border-radius:14px}}
.mbox h2{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.05em;text-transform:uppercase;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px)}

/* profit */
.phero{background:var(--bar);color:var(--bar-ink);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.phero .v{font-family:var(--f-display);font-weight:700;font-size:48px;line-height:1}
.phero .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

<body>
<div id="app">
  <header class="top" id="top"></header>
  <main id="main"></main>
  <button class="fab" id="fab" data-act="quickAdd" aria-label="Add a lead">+</button>
  <nav class="nav" id="nav"></nav>
</div>
<div id="sheet"></div>
<div id="modal"></div>

<script>
(() => {
"use strict";
/* ---------- constants ---------- */
const STAGES = {
  roofing: ["Appointment","Lead","Inspected","Claim Filed","Adjuster Meeting Complete","Denied","Approved","Built","Supplement","Complete"],
  granite: ["Lead","Hot Lead","Appointment","Estimate Sent","Follow-Up","Won","Installed","Paid"],
  other:   ["Lead","Estimate Sent","Won","In Progress","Complete"]
};
const CLOSED = {roofing:"Complete", granite:"Paid", other:"Complete"};
const TRADES = [["roofing","Roofing"],["granite","Granite"],["other","Other"]];
const SOURCES = ["Cold Call","Door Knock","Door Sign","Yard Sign","Referral","Tony","Angi","Google","Google Ad","Website","Craigslist","Other"];
const sourceList = () => [...SOURCES.slice(0,-1), ...S.settings.partners.map(p=>p.name).filter(nm=>nm && !SOURCES.some(x=>x.toLowerCase()===String(nm).toLowerCase())), "Other"];
const srcLabel = j => j.source==="Other" ? (String(j.sourceOther||"").trim() || "Other") : (j.source || "Not set");
const EXP_CATS = ["Materials","Sub labor","Labor","Permits","Equipment","Other"];
const PAY_METHODS = ["Check","Card","Cash","Insurance check","Other"];
const LOST_REASONS = ["Went with someone else","Insurance denied","Stopped answering","Price","Not ready yet","Other"];
const STALE_DAYS = 7;
const PATHS = [["Reinspection","Reinspection","Reinspection"],["Appraisal","Appraisal","Appraisal"],["Public Adjuster","Public Adjuster","PA"]];
const pathCls = p => "path-" + ((PATHS.find(x=>x[0]===p)||[])[2]||"");
const pathPill = p => p ? `<span class="pill path ${pathCls(p)}">${esc(p)}</span>` : "";
/* lead age: yellow at 15 days, orange at 30, red at 60 (open jobs only) */
const AGE_STEPS = [60,30,15];
const ageDays = j => Math.max(0, Math.floor((Date.now() - (j.createdAt||Date.now()))/864e5));
const isOpen = j => !j.lost && !isClosed(j);
const ageLevel = j => { if(!isOpen(j)) return 0; const d=ageDays(j); return AGE_STEPS.find(x=>d>=x) || 0; };
const needsAttn = j => ageLevel(j) > (j.attnAck||0);
const agePill = j => { const d=ageDays(j), l=ageLevel(j); return `<span class="pill ${l?"age"+l:""}">${d===0?"New today":d+(d===1?" day":" days")+" old"}</span>`; };
const attnSort = (a,b) => (needsAttn(b)-needsAttn(a)) || (ageLevel(b)-ageLevel(a)) || (ageDays(b)-ageDays(a));
const DRIVE = "Google Drive";
const DEFAULT_SETTINGS = {partners:[], receiptNo:0};
const OWNER_EMAIL = "redhammer.exteriors@gmail.com";
const NTFY = "https://ntfy.sh/";
const SUPABASE_URL = "https://muffdeytxkeinsvjikar.supabase.co";
const SUPABASE_KEY = "sb_publishable_I3tcHupLFIB5q4HzRKczLw_8GHRvGDG";
const BUCKET = "files";
const APP_VERSION = "Oct 1 · profit dates";
const PIXEL = "data:image/gif;base64,R0lGODlhAQABAAAAACw=";

/* ---------- state ---------- */
const S = {
  jobs:{}, settings:{...DEFAULT_SETTINGS}, trade:"roofing", view:"board",
  openJob:null, jobTab:"info", period:"month", lostQuery:"",
  ready:false, dbOk:null, authReady:false, srcYear:new Date().getFullYear(), srcFilter:"", isOwner:true, pendingContact:null, mode:"", me:null, ptab:"new"
};
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:true, autoRefreshToken:true}});
let session=null;
try{ const t=localStorage.getItem("rh-trade"); if(t && STAGES[t]) S.trade=t; }catch(e){}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const n = v => { const x = parseFloat(v); return isFinite(x) ? x : 0; };
const money = (v, cents) => (v<0?"-":"") + "$" + Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:cents?2:0, maximumFractionDigits:cents?2:0});
const fdate = t => t ? new Date(t).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}) : "";
const mapsUrl = a => "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(a||"");
const toLocalInput = t => { const d=new Date(t); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,16); };
const fdt = t => new Date(t).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const dateVal = s => { if(!s) return Date.now(); const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d,12).getTime(); };
const daysSince = j => Math.floor((Date.now() - (j.lastContact || j.createdAt || Date.now()))/864e5);
const digits = p => String(p||"").replace(/[^\d+]/g,"");
const tradeName = t => (TRADES.find(x=>x[0]===t)||[])[1] || t;

/* a job has a profit split only when its lead source is a partner (e.g. Tony) */
const paidOut = j => (j.partnerPayouts||[]).reduce((a,p)=>a+n(p.amount),0);
function partnerTotals(jobs){
  const t={earned:0, paid:0, owed:0, pipeShare:0, pipeRevenue:0, closedRevenue:0, collected:0, closed:0, open:0, dead:0, appts:0, opened:0, signed:0};
  jobs.forEach(j=>{ const c=calc(j), po=paidOut(j); t.paid+=po; t.collected+=c.paid;
    if(!j.lost && isClosed(j)){ t.earned+=c.cut; t.closedRevenue+=c.contract; t.closed++; }
    else if(isOpen(j)){ t.pipeShare+=c.cut; t.pipeRevenue+=c.contract; t.open++; }
    if(j.lost) t.dead++;
    else if(isOpen(j)){ if(j.stage==="Appointment") t.appts++; else if(j.signedAt) t.signed++; else t.opened++; } });
  t.owed=Math.max(0, t.earned-t.paid); return t;
}
/* saved contacts: enter once, pick from a dropdown on any job */
const CONTACT_KINDS = {
  subs:{one:"sub", title:"Sub", fields:[["name","Name"],["company","Company / crew"],["trade","Trade (roofing crew, gutters, paint…)"],["phone","Phone"],["email","Email"],["notes","Notes (rates, insurance on file…)"]]}
};
const contacts = kind => ((S.settings.contacts||{})[kind]||[]).slice().sort((a,b)=>String(a.name).localeCompare(String(b.name)));
const contactById = (kind,id) => ((S.settings.contacts||{})[kind]||[]).find(c=>c.id===id);
function saveContact(kind, c){
  const all={...(S.settings.contacts||{})}; const list=(all[kind]||[]).filter(x=>x.id!==c.id); list.push(c); all[kind]=list;
  return saveSettings({contacts:all});
}
function contactSelect(kind, field, val, label){
  const K=CONTACT_KINDS[kind];
  return `<select class="input" id="f-${field}" data-contact="${kind}" data-cfield="${field}" aria-label="${esc(label||K.title)}">
    <option value="">${esc(label||"Pick "+K.one)}</option>${contacts(kind).map(c=>`<option value="${esc(c.id)}" ${c.id===val?"selected":""}>${esc(c.name)}${c.company?" · "+esc(c.company):""}</option>`).join("")}
    <option value="__new">+ Add new ${K.one}…</option></select>`;
}
/* every payment to a sub = a job expense tagged with that sub */
function subPayments(subId, from, to){
  const out=[];
  Object.values(S.jobs).forEach(j=>(j.expenses||[]).forEach(e=>{
    const linked = e.subContactId===subId || (j.subs||[]).some(a=>a.expenseId===e.id && a.contactId===subId);
    if(linked && (e.date||0)>=from && (e.date||0)<to) out.push({...e, jobId:j.id, jobName:j.name});
  }));
  return out.sort((a,b)=>(b.date||0)-(a.date||0));
}
const yearRange = y => [new Date(y,0,1).getTime(), new Date(y+1,0,1).getTime()];
function subProfile(subId){
  const c0=contactById("subs",subId); if(!c0) return;
  const now=new Date(); let yr=now.getFullYear(), from=`${yr}-01-01`, to=`${yr}-12-31`;
  const draw = box => {
    const c=contactById("subs",subId)||c0;
    const f=dateVal(from)-12*3600e3, t=dateVal(to)+12*3600e3;
    const pays=subPayments(subId, f, t), tot=pays.reduce((a,p)=>a+n(p.amount),0);
    const [ya,yb]=yearRange(yr), yearTot=subPayments(subId, ya, yb).reduce((a,p)=>a+n(p.amount),0);
    const th=n(S.settings.threshold1099||2000);
    const years=[...new Set([now.getFullYear(), ...Object.values(S.jobs).flatMap(j=>(j.expenses||[]).map(e=>new Date(e.date||Date.now()).getFullYear()))])].sort((a,b)=>b-a);
    box.innerHTML=`<h2>${esc(c.name)}</h2><p class="muted" style="margin:0">${[c.company,c.trade,c.phone].filter(Boolean).map(esc).join(" · ")}</p>
      <div class="panel stack"><h3 class="sec">W-9</h3>
        ${c.w9Path?`<div class="row"><span class="pill fresh">✓ W-9 on file · ${fdate(c.w9Date)}</span><a class="btn small" href="${urlFor(c.w9Path)||"#"}" target="_blank" rel="noopener">View</a><button class="btn small ghost danger" id="w9-del">Remove</button></div>`
          :`<div class="row"><span class="pill stale">W-9 missing</span></div>`}
        <div class="dropzone" id="w9Drop"><b>${c.w9Path?"Replace W-9":"Drop their W-9 here"}</b><span class="small muted">PDF or photo, stored privately</span>
          <span class="btn filebtn" style="margin-top:6px">+ Upload W-9<input id="w9Input" type="file" accept="application/pdf,image/*" aria-label="Upload W-9"></span></div>
        <div class="grid2"><div class="field"><label for="w9-name">Legal / business name on W-9</label><input class="input" id="w9-name" value="${esc(c.w9Name||"")}"></div>
          <div class="field"><label for="w9-class">Tax classification</label><select class="input" id="w9-class">${["","Individual / sole proprietor","Single-member LLC","LLC (partnership)","LLC (S corp)","LLC (C corp)","S corporation","C corporation","Partnership","Other"].map(o=>`<option ${o===(c.w9Class||"")?"selected":""} value="${esc(o)}">${o||"Pick one"}</option>`).join("")}</select></div></div>
      </div>
      <div class="panel stack"><h3 class="sec">Paid to ${esc(c.name)}</h3>
        <div class="row"><label class="sr" for="sp-year">Year</label><select class="input" id="sp-year" style="width:auto">${years.map(y=>`<option ${y===yr?"selected":""}>${y}</option>`).join("")}</select>
          <span class="small muted">or pick dates:</span></div>
        <div class="grid2"><div class="field"><label for="sp-from">From</label><input class="input" id="sp-from" type="date" value="${from}"></div><div class="field"><label for="sp-to">To</label><input class="input" id="sp-to" type="date" value="${to}"></div></div>
        <div class="tot num"><span>Total for these dates</span><span>${money(tot,1)}</span></div>
        <div class="small ${yearTot>=th?"":"muted"}" style="${yearTot>=th?"color:var(--warn);font-weight:700":""}">${yr} total: ${money(yearTot,1)}${yearTot>=th?` · over ${money(th)}, you'll likely need to send them a 1099-NEC${c.w9Path?"":" (and you don't have a W-9 yet)"}`:` · 1099 threshold ${money(th)}`}</div>
        ${pays.length?`<div class="list">${pays.map(p=>`<div class="li"><div class="grow"><div class="t num">${money(n(p.amount),1)}</div><div class="s">${fdate(p.date)} · ${esc(p.jobName||"")}${p.desc?" · "+esc(p.desc):""}</div></div><button class="btn small" data-act="open" data-id="${esc(p.jobId)}">Job</button></div>`).join("")}</div>`
          :`<p class="small muted" style="margin:0">No payments in these dates. Payments show up here when you log a sub's payment as an expense on a job.</p>`}
      </div>
      <div class="row"><button class="btn" data-act="closeModal">Done</button><button class="btn ghost" data-act="editContact" data-kind="subs" data-id="${esc(c.id)}">Edit contact info</button></div>`;
    const redraw=()=>draw(box);
    box.querySelector("#sp-year").onchange=e=>{ yr=Number(e.target.value); from=`${yr}-01-01`; to=`${yr}-12-31`; redraw(); };
    box.querySelector("#sp-from").onchange=e=>{ from=e.target.value||from; redraw(); };
    box.querySelector("#sp-to").onchange=e=>{ to=e.target.value||to; redraw(); };
    const saveField=(k,v)=>{ const cc={...(contactById("subs",subId)||c0), [k]:v}; saveContact("subs", cc); };
    box.querySelector("#w9-name").onchange=e=>saveField("w9Name", e.target.value.trim());
    box.querySelector("#w9-class").onchange=e=>saveField("w9Class", e.target.value);
    const up=async file=>{ if(!file) return; let blob=file, type=file.type||"application/pdf";
      if(type.startsWith("image/")){ blob=await compressImage(file); type="image/jpeg"; }
      if(!ASSET_TYPES.includes(type)){ toast("Use a PDF or photo"); return; }
      toast("Uploading W-9…");
      try{ const path=await storeAsset(blob, type, "contacts/"+subId); const old=(contactById("subs",subId)||{}).w9Path;
        await saveContact("subs", {...(contactById("subs",subId)||c0), w9Path:path, w9Date:Date.now()});
        if(old) sb.storage.from(BUCKET).remove([old]); toast("W-9 saved"); redraw(); }catch(e){ toast(assetErr(e)); } };
    box.querySelector("#w9Input").onchange=e=>{ const fl=e.target.files[0]; e.target.value=""; up(fl); };
    const dz=box.querySelector("#w9Drop");
    dz.addEventListener("dragover", e=>{ e.preventDefault(); e.stopPropagation(); dz.classList.add("over"); });
    dz.addEventListener("dragleave", ()=>dz.classList.remove("over"));
    dz.addEventListener("drop", e=>{ e.preventDefault(); e.stopPropagation(); dz.classList.remove("over"); up(e.dataTransfer.files[0]); });
    box.querySelector("#w9-del")?.addEventListener("click", ()=>{ const cc={...(contactById("subs",subId)||c0)}; const old=cc.w9Path; delete cc.w9Path; delete cc.w9Date; saveContact("subs", cc).then(()=>{ if(old) sb.storage.from(BUCKET).remove([old]); redraw(); }); });
    if(c.w9Path && !urlFor(c.w9Path)) setTimeout(()=>{ if(box.isConnected) redraw(); }, 800);
  };
  openModal(`<div id="spbox" class="stack"></div>`, box=>draw(box.querySelector("#spbox")));
}
function contactCard(kind, c, extra=""){
  if(!c) return "";
  return `<div class="cline" style="gap:6px"><div class="grow" style="flex:1;min-width:150px"><div class="t">${esc(c.name)}</div><div class="s small muted">${[c.company,c.trade,c.phone,c.email].filter(Boolean).map(esc).join(" · ")}</div>${c.notes?`<div class="s small muted">${esc(c.notes)}</div>`:""}</div>
    ${c.phone?`<a class="btn small primary" href="tel:${esc(digits(c.phone))}">Call</a><a class="btn small" href="sms:${esc(digits(c.phone))}">Text</a>`:""}
    ${c.email?`<a class="btn small" href="mailto:${esc(c.email)}">Email</a>`:""}
    ${kind==="subs"?`<button class="btn small" data-act="subProfile" data-id="${esc(c.id)}">${c.w9Path?"✓ W-9":"W-9 missing"} · payments</button>`:""}
    <button class="btn small ghost" data-act="editContact" data-kind="${kind}" data-id="${esc(c.id)}">Edit</button>${extra}</div>`;
}
function editContact(kind, id, onSaved){
  const K=CONTACT_KINDS[kind], c=contactById(kind,id)||{id:"", name:""};
  openModal(`<h2>${c.id?"Edit":"New"} ${esc(K.one)}</h2>
    ${K.fields.map(([k,l])=>`<div class="field"><label for="ct-${k}">${esc(l)}</label>${k==="notes"?`<textarea class="input" id="ct-${k}" style="min-height:60px">${esc(c[k]||"")}</textarea>`:`<input class="input" id="ct-${k}" ${k==="phone"?'type="tel" inputmode="tel"':k==="email"?'type="email" inputmode="email"':""} value="${esc(c[k]||"")}">`}</div>`).join("")}
    <p class="small muted" style="margin:0">Saved to your contacts, so you can pick them on any job.</p>
    <div class="row"><button class="btn primary" id="ct-save">Save</button><button class="btn ghost" data-act="closeModal">Cancel</button>
    ${c.id?`<button class="btn ghost danger" id="ct-del" style="margin-left:auto">Delete</button>`:""}</div>`, box=>{
    box.querySelector("#ct-save").addEventListener("click", ()=>{
      const nc={id:c.id||rid()}; K.fields.forEach(([k])=>nc[k]=box.querySelector("#ct-"+k).value.trim());
      if(!nc.name){ toast("Add a name"); box.querySelector("#ct-name").focus(); return; }
      saveContact(kind, nc); closeModal(); toast(K.title+" saved"); if(onSaved) onSaved(nc);
    });
    box.querySelector("#ct-del")?.addEventListener("click", ()=>{
      confirmBox("Delete "+(c.name||K.one)+"?", "They'll be removed from your contacts. Jobs that used them will show no "+K.one+".", "Delete", ()=>{
        const all={...(S.settings.contacts||{})}; all[kind]=(all[kind]||[]).filter(x=>x.id!==c.id); saveSettings({contacts:all}); toast("Deleted");
      });
    });
  });
}
const PERMS = [
  ["b_roofing","Roofing board"],["b_granite","Granite board"],["b_other","Other board"],
  ["addLeads","Add new leads"],["edit","Edit jobs (stages, details, notes, mark lost)"],
  ["money","See money (prices, expenses, profit, payments)"],["expenses","Add expenses & receipt photos"],
  ["payments","Record customer payments & make receipts"],["files","View & upload documents"],
  ["lost","See Lost Leads"],["profit","See Profit reports"],["delete","Delete leads forever"]];
const PRESETS = {Crew:{b_roofing:1,expenses:1,files:1}, Office:{b_roofing:1,b_granite:1,b_other:1,addLeads:1,edit:1,money:1,expenses:1,payments:1,files:1,lost:1}, Everything:Object.fromEntries(PERMS.map(p=>[p[0],1]))};
const myTrades = () => TRADES.filter(([k])=>can("b_"+k));
const can = k => S.mode==="owner" || (S.mode==="employee" && !!(S.me && S.me.perms && S.me.perms[k]));
const TONY_DEFAULT = {id:"tony", name:"Tony", pct:15, basis:"profit"};
function partnerFor(j){
  const src = String(srcLabel(j)).trim().toLowerCase();
  const p = S.settings.partners.find(x=>String(x.name).trim().toLowerCase()===src);
  if(p) return p;
  if(src==="tony") return S.settings.partners.find(x=>x.id==="tony") || TONY_DEFAULT;
  return null;
}
function calc(j){
  const contract = n(j.contract);
  const expenses = (j.expenses||[]).reduce((a,e)=>a+n(e.amount),0);
  const paid = (j.payments||[]).reduce((a,p)=>a+n(p.amount),0);
  const profit = contract - expenses;
  let cut = 0, pct = 0, basis = "profit", partner = null;
  partner = partnerFor(j);
  if(partner){
    pct = j.splitPct!=null && j.splitPct!=="" ? n(j.splitPct) : n(partner?.pct);
    basis = j.splitBasis || partner?.basis || "profit";
    cut = (basis==="contract" ? contract : Math.max(profit,0)) * pct/100;
  }
  return {contract, expenses, paid, profit, cut, net: profit-cut, balance: contract-paid, pct, basis, partner};
}
const isClosed = j => j.stage === CLOSED[j.trade];

function toast(msg){
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg; t.setAttribute("role","status");
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2600);
}

/* ---------- persistence (Supabase) ---------- */
const row = j => ({id:j.id, trade:j.trade, stage:j.stage, lost:!!j.lost, partner_id:(partnerFor(j)||{}).id||null, data:j, updated_at:new Date().toISOString()});
const chains = {};
function mutateJob(id, fn){
  chains[id] = (chains[id]||Promise.resolve()).then(async () => {
    const base = S.jobs[id]; if(!base) return;
    const cur = structuredClone(base);
    fn(cur); cur.updatedAt = Date.now();
    S.jobs[id] = cur; renderSoon();
    const {error} = S.mode==="owner" ? await sb.from("jobs").upsert(row(cur)) : await sb.from("jobs").update(row(cur)).eq("id", id);
    if(error) writeErr(error);
  }).catch(e=>writeErr(e));
  return chains[id];
}
async function createJob(j){
  S.jobs[j.id]=j; renderSoon();
  const {error} = await sb.from("jobs").insert(row(j)); if(error) writeErr(error);
}
async function deleteJobDoc(id){
  const j = S.jobs[id]; delete S.jobs[id]; renderSoon();
  const {error} = await sb.from("jobs").delete().eq("id", id); if(error) writeErr(error);
  if(j){
    const paths=[...(j.expenses||[]).map(e=>e.assetId),...(j.payments||[]).flatMap(p=>[p.assetId,...(p.photos||[])]),...(j.docs||[]).map(d=>d.assetId)].filter(Boolean);
    if(paths.length) await sb.storage.from(BUCKET).remove(paths);
  }
}
let settingsChain = Promise.resolve();
function saveSettings(patch){
  settingsChain = settingsChain.then(async () => {
    S.settings = {...S.settings, ...patch}; renderSoon();
    const {error} = await sb.from("settings").upsert({id:1, data:S.settings, updated_at:new Date().toISOString()}); if(error) writeErr(error);
  });
  return settingsChain;
}
function writeErr(e){
  console.error(e);
  if(e && e.message && navigator.onLine){ S.dbErr = e.message; S.dbOk=false; renderSoon(); toast("Didn't save: "+e.message); return; }
  S.dbOk = navigator.onLine ? S.dbOk : false; renderSoon();
  toast(navigator.onLine ? "Couldn't save that change. Try again." : "No signal. That change didn't save.");
}
/* Drive filing is paused in the standalone app; files live in the app's own storage. */

/* paperwork cleanup: stretch contrast (lifts haze, darkens ink) and sharpen text edges */
function enhancePaper(g, w, h){
  const img=g.getImageData(0,0,w,h), d=img.data, n=w*h;
  const hist=new Uint32Array(256);
  for(let i=0;i<d.length;i+=4) hist[(d[i]*77+d[i+1]*150+d[i+2]*29)>>8]++;
  let lo=0, hi=255, acc=0;
  for(let v=0;v<256;v++){ acc+=hist[v]; if(acc>n*0.01){ lo=v; break; } }
  acc=0; for(let v=255;v>=0;v--){ acc+=hist[v]; if(acc>n*0.02){ hi=v; break; } }
  if(hi-lo<40){ lo=0; hi=255; }
  const lut=new Uint8ClampedArray(256), span=hi-lo;
  for(let v=0;v<256;v++) lut[v]=Math.round(Math.pow(Math.min(1,Math.max(0,(v-lo)/span)),1.15)*255);
  for(let i=0;i<d.length;i+=4){ d[i]=lut[d[i]]; d[i+1]=lut[d[i+1]]; d[i+2]=lut[d[i+2]]; }
  /* light unsharp mask (3x3), 60% strength */
  const src=new Uint8ClampedArray(d), row=w*4, k=0.6;
  for(let y=1;y<h-1;y++){ for(let x=1;x<w-1;x++){ const p=y*row+x*4;
    for(let c=0;c<3;c++){ const o=p+c, lap=4*src[o]-src[o-4]-src[o+4]-src[o-row]-src[o+row]; d[o]=src[o]+k*lap; } } }
  g.putImageData(img,0,0);
}
/* shrink photos: 1600px long edge, JPEG, stepping quality down until under ~350 KB (receipts stay sharp) */
async function compressImage(file){
  if(!file || !String(file.type||"image/jpeg").startsWith("image/") || file.type==="image/gif") return file;
  try{
    const bmp = await createImageBitmap(file);
    const max = 1600, sc = Math.min(1, max/Math.max(bmp.width,bmp.height));
    const c = document.createElement("canvas"); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
    const g = c.getContext("2d"); g.imageSmoothingEnabled=true; g.imageSmoothingQuality="high"; g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(bmp,0,0,c.width,c.height);
    try{ enhancePaper(g, c.width, c.height); }catch(e){}
    let out=null;
    g.imageSmoothingQuality="high";
    for(const q of [0.8,0.72,0.64,0.55]){
      out = await new Promise(r=>c.toBlob(r,"image/jpeg",q));
      if(out && out.size <= 350000) break;
    }
    return (out && out.size < file.size) ? out : (out || file);
  }catch(e){ return file; }
}
/* camera inside the app, so Android never has to leave the CRM.
   Picks the main rear lens (not the ultra-wide, which can't focus close), asks for continuous focus,
   and takes a real still photo when the phone supports it. */
async function camStream(deviceId){
  const v = deviceId ? {deviceId:{exact:deviceId}, width:{ideal:3840}, height:{ideal:2160}}
                     : {facingMode:{ideal:"environment"}, width:{ideal:3840}, height:{ideal:2160}};
  return navigator.mediaDevices.getUserMedia({video:v, audio:false});
}
async function backCameras(){
  try{
    const ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==="videoinput");
    const back=ds.filter(d=>/back|rear|environment/i.test(d.label));
    const list=(back.length?back:ds);
    /* main lens first: Android usually labels it "camera2 0"; push wide/tele/macro to the end */
    const score=d=>(/camera2 0\b/.test(d.label)?0:10)+(/ultra|wide|tele|macro|depth/i.test(d.label)?5:0);
    return list.slice().sort((a,b)=>score(a)-score(b));
  }catch(e){ return []; }
}
async function tuneTrack(track){
  try{
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    const adv=[];
    if(caps.focusMode && caps.focusMode.includes("continuous")) adv.push({focusMode:"continuous"});
    if(caps.exposureMode && caps.exposureMode.includes("continuous")) adv.push({exposureMode:"continuous"});
    if(adv.length) await track.applyConstraints({advanced:adv});
  }catch(e){}
}
function openCamera(){
  return new Promise(async resolve=>{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ resolve(undefined); return; }
    let stream, cams=[], camIdx=0;
    try{
      stream = await camStream();
      cams = await backCameras();
      const cur = stream.getVideoTracks()[0].getSettings().deviceId;
      if(cams.length && cams[0].deviceId && cams[0].deviceId!==cur){
        try{ const s2=await camStream(cams[0].deviceId); stream.getTracks().forEach(t=>t.stop()); stream=s2; }catch(e){}
      }
      camIdx = Math.max(0, cams.findIndex(c=>c.deviceId===stream.getVideoTracks()[0].getSettings().deviceId));
    }catch(e){ window.__camErr = (e && (e.name+": "+e.message)) || "unknown"; resolve(e && e.name==="NotAllowedError" ? "denied" : undefined); return; }
    const el=document.createElement("div"); el.className="cam";
    el.innerHTML=`<video playsinline autoplay muted></video><div class="camhint">Hold steady, fill the screen with the receipt</div>
      <div class="camctl"><button type="button" class="btn" data-c="x">Cancel</button><button type="button" class="shutter" data-c="snap" aria-label="Take photo"></button>
      ${cams.length>1?`<button type="button" class="btn" data-c="lens">Switch lens</button>`:`<span style="width:84px"></span>`}</div>`;
    document.body.appendChild(el);
    const v=el.querySelector("video");
    const attach=async()=>{ v.srcObject=stream; await tuneTrack(stream.getVideoTracks()[0]); };
    await attach();
    let busy=false;
    const done=b=>{ stream.getTracks().forEach(t=>t.stop()); el.remove(); resolve(b); };
    el.addEventListener("click", async e=>{
      const c=e.target.closest("[data-c]"); if(!c || busy) return;
      if(c.dataset.c==="x") return done(null);
      if(c.dataset.c==="lens"){
        busy=true; camIdx=(camIdx+1)%cams.length;
        try{ const s2=await camStream(cams[camIdx].deviceId); stream.getTracks().forEach(t=>t.stop()); stream=s2; await attach(); }catch(err){}
        busy=false; return;
      }
      busy=true; c.style.opacity=".5";
      const track=stream.getVideoTracks()[0];
      /* a real still photo (autofocus + full sensor) where Chrome supports it */
      if(window.ImageCapture){
        try{ const b=await new ImageCapture(track).takePhoto(); if(b && b.size) return done(b); }catch(err){}
      }
      if(!v.videoWidth){ busy=false; c.style.opacity=""; return; }
      const cv=document.createElement("canvas"); cv.width=v.videoWidth; cv.height=v.videoHeight;
      cv.getContext("2d").drawImage(v,0,0); cv.toBlob(b=>done(b),"image/jpeg",0.92);
    });
  });
}

function wirePhotoPicker(box, pfx, onPhoto){
  const msg=box.querySelector(`#${pfx}-msg`);
  const use = async blob=>{
    if(!blob) return;
    msg.textContent="Shrinking photo…";
    const small = await compressImage(blob);
    const im=box.querySelector(`#${pfx}-prev`); im.src=URL.createObjectURL(small); im.hidden=false;
    msg.textContent=`Photo added (${Math.max(1,Math.round(small.size/1024))} KB). Tap a button to replace it.`;
    onPhoto(small);
  };
  const onFile = e=>{ const f=e.target.files[0]; e.target.value=""; use(f); };
  box.querySelector(`#${pfx}-lib`).addEventListener("change", onFile);
  box.querySelector(`#${pfx}-cam`).addEventListener("click", async ()=>{
    const r = await openCamera();
    if(r instanceof Blob) return use(r);
    if(r===null) return;
    const why = window.__camErr ? ` (${window.__camErr})` : "";
    if(r==="denied"){ msg.textContent="Camera is blocked. In Chrome tap ⋮ → Settings → Site settings → Camera and allow this site, or use Upload from gallery."+why; return; }
    msg.textContent="The camera couldn't start. Close other apps and try again, or use Upload from gallery."+why;
  });
}
const ASSET_TYPES = ["image/png","image/jpeg","image/gif","image/webp","application/pdf"];
async function storeAsset(blob, type, jobId){
  const ext = type==="application/pdf" ? "pdf" : type==="image/png" ? "png" : type==="image/webp" ? "webp" : type==="image/gif" ? "gif" : "jpg";
  const path = `${jobId}/${rid()}.${ext}`;
  const {error} = await sb.storage.from(BUCKET).upload(path, blob, {contentType:type, upsert:false});
  if(error) throw error;
  return path;
}
function assetErr(e){
  const m = String(e && (e.message||e.error) || "");
  if(/size|large/i.test(m)) return "That file is too big.";
  if(!navigator.onLine) return "No signal. The file didn't upload.";
  return "Upload failed. Try again.";
}
/* signed links for private files, fetched in batches and cached ~50 min */
const URLS = {}; let urlQueue = new Set(), urlTimer = null;
function urlFor(p){
  if(!p) return "";
  const c = URLS[p]; if(c && c.exp > Date.now()) return c.url;
  urlQueue.add(p);
  if(!urlTimer) urlTimer = setTimeout(flushUrls, 0);
  return "";
}
async function flushUrls(){
  const paths=[...urlQueue]; urlQueue=new Set(); urlTimer=null;
  if(!paths.length) return;
  const {data, error} = await sb.storage.from(BUCKET).createSignedUrls(paths, 3600);
  let got=0;
  (data||[]).forEach(d=>{ if(d && d.signedUrl && d.path){ URLS[d.path]={url:d.signedUrl, exp:Date.now()+50*60e3}; got++; } });
  /* anything that couldn't be signed waits a minute before trying again (prevents a redraw loop) */
  paths.forEach(p=>{ if(!URLS[p] || URLS[p].exp<=Date.now()) URLS[p]={url:"", exp:Date.now()+60e3}; });
  if(got && !error) renderSoon();
}
async function fileBlob(p){
  const {data, error} = await sb.storage.from(BUCKET).download(p);
  if(error) throw error; return data;
}
async function shareOrSave(blob, filename, title){
  const file = new File([blob], filename, {type:blob.type||"application/pdf"});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title}); return; }catch(e){ if(e && e.name==="AbortError") return; }
  }
  const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

let renderQueued=false, renderDeferred=false;
function renderSoon(){
  if(renderQueued) return; renderQueued=true;
  requestAnimationFrame(()=>{ renderQueued=false;
    const a=document.activeElement;
    if(a && a.matches("input,textarea,select") && !a.closest("#modal")){ renderDeferred=true; return; }
    render();
  });
}
document.addEventListener("focusout", ()=>{ if(renderDeferred){ renderDeferred=false; setTimeout(renderSoon, 0); } });

async function sweepReminders(){
  if(!myTopic()) return;
  for(const j of Object.values(S.jobs)) for(const r of (j.reminders||[])){
    if(r.done || (r.by && r.by!==myEmail()) || r.alarmFor===r.at || r.at<Date.now()+30e3 || r.at-Date.now()>MAX_AHEAD) continue;
    if(await scheduleReminder(j, r)) await mutateJob(j.id, x=>{ const y=(x.reminders||[]).find(z=>z.id===r.id); if(y) y.alarmFor=y.at; });
  }
}

/* ----- storage meter & backups ----- */
const PLAN = {files:1024**3, db:500*1024**2};
const fmtBytes = b => b>=1024**3 ? (b/1024**3).toFixed(2)+" GB" : b>=1024**2 ? (b/1024**2).toFixed(b>=100*1024**2?0:1)+" MB" : Math.max(1,Math.round(b/1024))+" KB";
function meter(label, used, cap){
  const pct=Math.min(100, used/cap*100), cls=pct>=90?"var(--red)":pct>=75?"var(--warn)":"var(--good)";
  return `<div class="bar"><div class="top2"><span>${label}</span><b class="num">${fmtBytes(used)} of ${fmtBytes(cap)}</b></div>
    <div class="track" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}" aria-label="${label} used"><div class="fill" style="width:${Math.max(pct,1)}%;background:${cls}"></div></div>
    <div class="small muted" style="margin-top:2px">${pct.toFixed(pct<10?1:0)}% used</div></div>`;
}
function usageHTML(){
  const u=S.usage;
  if(u===undefined){ loadUsage(); return `<p class="small muted" style="margin:0">Checking storage…</p>`; }
  if(u===null) return `<p class="small muted" style="margin:0">Storage meter isn't set up yet. Ask Claude for the storage-meter.sql snippet, or paste it in Supabase → SQL Editor.</p>`;
  const warn = u.files_bytes/PLAN.files>=0.8 ? `<p class="small" style="margin:0;color:var(--warn);font-weight:700">Getting close to the free limit. The paid Supabase plan raises it to 100 GB.</p>` : "";
  return `<div class="bars">${meter("Photos & files", u.files_bytes, PLAN.files)}${meter("Jobs & records", u.db_bytes, PLAN.db)}</div>
    <p class="small muted" style="margin:6px 0 0">${u.files_count} file${u.files_count===1?"":"s"} stored. Limits shown are the free plan.</p>${warn}`;
}
let usageLoading=false;
async function loadUsage(){
  if(usageLoading) return; usageLoading=true;
  const {data, error}=await sb.rpc("storage_usage");
  S.usage = (error || !data) ? null : data; usageLoading=false;
  const box=$("#usageBox"); if(box) box.innerHTML=usageHTML();
}
function saveFile(name, text, type){
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

/* ----- profit ----- */
const ymd = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function monthDefault(){ const d=new Date(); return [ymd(new Date(d.getFullYear(),d.getMonth(),1)), ymd(new Date(d.getFullYear(),d.getMonth()+1,0))]; }
const parseYmd = v => { const [y,m,d]=String(v).split("-").map(Number); return new Date(y,m-1,d); };
function profitRange(){
  if(!S.pFrom || !S.pTo){ const [a,b]=monthDefault(); S.pFrom=S.pFrom||a; S.pTo=S.pTo||b; }
  let a=parseYmd(S.pFrom), b=parseYmd(S.pTo); if(b<a) [a,b]=[b,a];
  const end=new Date(b.getFullYear(),b.getMonth(),b.getDate()+1);
  const f=d=>MONTHS[d.getMonth()]+" "+d.getDate()+(d.getFullYear()!==new Date().getFullYear()||a.getFullYear()!==b.getFullYear()?", "+d.getFullYear():"");
  return {range:[a.getTime(), end.getTime()], label: f(a)+" – "+f(b)};
}
function periodRange(p){
  const d=new Date(), y=d.getFullYear(), m=d.getMonth(), t=(Y,M)=>new Date(Y,M,1).getTime();
  if(p==="month") return [t(y,m), Infinity];
  if(p==="lastmonth") return [t(y,m-1), t(y,m)];
  if(p==="year") return [t(y,0), Infinity];
  if(p==="lastyear") return [t(y-1,0), t(y,0)];
  return [0, Infinity];
}
const inRange = (ts,[a,b]) => ts!=null && ts>=a && ts<b;
const kMoney = v => Math.abs(v)>=1000 ? (v<0?"-":"")+"$"+(Math.abs(v)/1000).toFixed(Math.abs(v)>=10000?0:1).replace(/\.0$/,"")+"k" : money(v);
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
/* horizontal bars, one hue, value labels in text ink */
function hbars(rows, fmt, empty){
  if(!rows.length) return `<p class="muted small" style="margin:0">${empty}</p>`;
  const max=Math.max(1,...rows.map(r=>Math.abs(r.v)));
  return `<div class="bars">${rows.map(r=>`<div class="bar" tabindex="0" title="${esc(r.tip||"")}"><div class="top2"><span>${esc(r.k)}</span><b class="num">${fmt(r.v)}</b></div>
    <div class="track"><div class="fill" style="width:${Math.max(r.v?2:0,Math.round(Math.abs(r.v)/max*100))}%"></div></div>${r.sub?`<div class="small muted" style="margin-top:2px">${esc(r.sub)}</div>`:""}</div>`).join("")}</div>`;
}
/* 12-month column chart */
function mcols(vals, fmt, label){
  const max=Math.max(1,...vals), cur = S.srcYear===new Date().getFullYear() ? new Date().getMonth() : -1;
  return `<div class="mchart" role="img" aria-label="${esc(label)}">${vals.map((v,i)=>`<div class="mcol ${i===cur?"cur":""}" tabindex="0" data-tip="${MONTHS[i]}: ${esc(fmt(v))}">
      <span class="mval num">${v?esc(fmt(v)):""}</span><span class="mbar" style="height:${v?Math.max(3,Math.round(v/max*100)):0}%"></span><span class="mlab">${MONTHS[i].slice(0,1)}</span></div>`).join("")}</div>`;
}
function leadSourceSection(range, pl){
  const all = Object.values(S.jobs);
  const leads = all.filter(j=>inRange(j.createdAt, range));
  const closed = all.filter(j=>!j.lost && isClosed(j) && inRange(j.closedAt||j.updatedAt, range));
  const agg = {};
  leads.forEach(j=>{ const k=srcLabel(j); (agg[k]=agg[k]||{leads:0,rev:0,net:0,jobs:0}).leads++; });
  closed.forEach(j=>{ const k=srcLabel(j), c=calc(j); const a=(agg[k]=agg[k]||{leads:0,rev:0,net:0,jobs:0}); a.rev+=c.contract; a.net+=c.net; a.jobs++; });
  const ent = Object.entries(agg);
  const leadRows = ent.filter(([,a])=>a.leads).sort((x,y)=>y[1].leads-x[1].leads).map(([k,a])=>({k, v:a.leads, tip:`${k}: ${a.leads} lead${a.leads===1?"":"s"}`}));
  const revRows = ent.filter(([,a])=>a.jobs).sort((x,y)=>y[1].rev-x[1].rev).map(([k,a])=>({k, v:a.rev, sub:`${a.jobs} closed job${a.jobs===1?"":"s"} · you kept ${money(a.net)}`, tip:`${k}: ${money(a.rev)} revenue`}));
  /* month by month for the chosen year */
  const years=[...new Set(all.flatMap(j=>[j.createdAt,j.closedAt]).filter(Boolean).map(t=>new Date(t).getFullYear()))];
  const thisY=new Date().getFullYear(); if(!years.includes(thisY)) years.push(thisY); years.sort((a,b)=>b-a);
  if(!years.includes(S.srcYear)) S.srcYear=thisY;
  const srcs=[...new Set(all.map(srcLabel))].sort();
  if(S.srcFilter && !srcs.includes(S.srcFilter)) S.srcFilter="";
  const pick = j => !S.srcFilter || srcLabel(j)===S.srcFilter;
  const ml=Array(12).fill(0), mr=Array(12).fill(0);
  all.filter(pick).forEach(j=>{
    if(j.createdAt){ const d=new Date(j.createdAt); if(d.getFullYear()===S.srcYear) ml[d.getMonth()]++; }
    const ct=j.closedAt||(isClosed(j)?j.updatedAt:null);
    if(!j.lost && isClosed(j) && ct){ const d=new Date(ct); if(d.getFullYear()===S.srcYear) mr[d.getMonth()]+=calc(j).contract; }
  });
  const totL=ml.reduce((a,b)=>a+b,0), totR=mr.reduce((a,b)=>a+b,0);
  return `<div class="panel stack"><h3 class="sec">Where leads come from <span class="r small muted" style="font-family:var(--f-body);letter-spacing:0;text-transform:none;font-weight:400">${esc(pl)}</span></h3>
      <div class="grid2" style="align-items:start;gap:18px">
        <div class="stack" style="gap:8px"><div class="label">Leads · ${leads.length}</div>${hbars(leadRows, v=>String(v), "No leads added in this period.")}</div>
        <div class="stack" style="gap:8px"><div class="label">Revenue · ${money(revRows.reduce((a,r)=>a+r.v,0))}</div>${hbars(revRows, v=>money(v), "No jobs closed in this period.")}</div>
      </div>
      <p class="small muted" style="margin:0">Leads count by the day they were added. Revenue counts closed jobs by the day they closed.</p>
    </div>
    <div class="panel stack"><h3 class="sec">Month by month</h3>
      <div class="row">
        <label class="sr" for="srcYear">Year</label><select class="input" id="srcYear" style="width:auto;flex:none">${years.map(y=>`<option ${y===S.srcYear?"selected":""}>${y}</option>`).join("")}</select>
        <label class="sr" for="srcFilter">Lead source</label><select class="input" id="srcFilter" style="flex:1;min-width:150px"><option value="">All lead sources</option>${srcs.map(x=>`<option ${x===S.srcFilter?"selected":""}>${esc(x)}</option>`).join("")}</select>
      </div>
      <div><div class="label" style="margin-bottom:6px">Leads added · ${totL}</div>${mcols(ml, v=>String(v), "Leads added per month")}</div>
      <div><div class="label" style="margin-bottom:6px">Revenue closed · ${money(totR)}</div>${mcols(mr, kMoney, "Revenue closed per month")}</div>
    </div>`;
}

  const partners = (S.settings.partners.some(p=>p.id==="tony"||/^tony$/i.test(p.name))?S.settings.partners:[...S.settings.partners,TONY_DEFAULT]).map(p=>({p, v: closed.filter(j=>(partnerFor(j)||{}).id===p.id).reduce((a,j)=>a+calc(j).cut,0)})).filter(x=>x.v);

      <div class="small" style="color:var(--bar-muted)">${closed.length} closed job${closed.length===1?"":"s"}</div></div>
      <div class="kv num"><div><span>Revenue</span><b>${money(tot.rev)}</b></div><div><span>Expenses</span><b>${money(tot.exp)}</b></div><div><span>Partner share</span><b>${money(tot.cut)}</b></div></div>
    </div>
    <div class="panel stack"><h3 class="sec">By trade</h3>
      <div class="bars">${byTrade.map(t=>`<div class="bar"><div class="top2"><span>${t.l} <span class="muted small">${t.c} job${t.c===1?"":"s"}</span></span><b class="num">${money(t.v)}</b></div><div class="track"><div class="fill ${t.v<0?"negf":""}" style="width:${Math.round(Math.abs(t.v)/maxT*100)}%"></div></div></div>`).join("")}</div>
    </div>

    ${partners.length?`<div class="panel stack"><h3 class="sec">Partner share · ${esc(label)}</h3><div class="list">${partners.map(x=>`<div class="li"><div class="grow t">${esc(x.p.name)}</div><b class="num">${money(x.v)}</b></div>`).join("")}</div></div>`:""}
    ${(()=>{ const tj=Object.values(S.jobs).filter(j=>(partnerFor(j)||{}).id==="tony"); if(!tj.length || S.mode!=="owner") return ""; const t=partnerTotals(tj);
      return `<div class="panel stack"><h3 class="sec">Tony · all time</h3><div class="list num">

    <div class="panel stack"><h3 class="sec">Open jobs</h3>
      <div class="grid2 num"><div><div class="label">In the pipeline</div><b style="font-size:20px">${money(pipe.contract)}</b><div class="small muted">${open.length} open job${open.length===1?"":"s"}</div></div>

/* ---------- modal ---------- */
function openModal(html, mount){
  $("#modal").innerHTML = `<div class="modal" data-act="modalBg"><div class="mbox" role="dialog" aria-modal="true">${html}</div></div>`;
  const f = $("#modal").querySelector("input:not([type=file]),textarea,select");
  if(mount) mount($("#modal .mbox"));
  if(f && !f.dataset.nofocus) setTimeout(()=>f.focus(), 30);
}
function closeModal(){ $("#modal").innerHTML=""; }
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ if($("#modal").innerHTML) closeModal(); else if(S.openJob){ S.openJob=null; render(); } } });

function chipsPick(root, name){
  root.querySelectorAll(`[data-pick="${name}"]`).forEach(b=>b.addEventListener("click",()=>{
    root.querySelectorAll(`[data-pick="${name}"]`).forEach(x=>x.setAttribute("aria-pressed","false"));
    b.setAttribute("aria-pressed","true");
  }));
}
const picked = (root,name) => { const b=root.querySelector(`[data-pick="${name}"][aria-pressed="true"]`); return b?b.dataset.v:""; };

function contactLog(kind){
  const j=S.jobs[S.openJob]; if(!j) return;
  const isCall = kind==="call";
  const outs = isCall ? ["No answer","Left voicemail","Talked"] : ["Sent email","Got a reply"];
  openModal(`<h2>${isCall?"How'd the call go?":"Log an email"}</h2>
    <p class="muted" style="margin:0">${esc(j.name)}</p>
    <div class="chips">${outs.map((o,i)=>`<button type="button" class="chip" data-pick="out" data-v="${esc(o)}" aria-pressed="${i===(isCall?2:0)}">${esc(o)}</button>`).join("")}</div>
    ${isCall?`<div class="field"><label for="cl-min">Minutes (optional)</label><input class="input num" id="cl-min" type="number" inputmode="numeric" min="0" data-nofocus="1"></div>`:""}
    <div class="field"><label for="cl-note">Note (optional)</label><textarea class="input" id="cl-note" data-nofocus="1" style="min-height:60px"></textarea></div>
    <div class="row"><button class="btn primary" id="cl-save">Save</button><button class="btn ghost" data-act="closeModal">Skip</button></div>`, box=>{
    chipsPick(box,"out");
    box.querySelector("#cl-save").addEventListener("click",()=>{
      const out=picked(box,"out"), min=box.querySelector("#cl-min")?.value, note=box.querySelector("#cl-note").value.trim();
      const text=(isCall?"Call: ":"Email: ")+out+(min?` (${min} min)`:"")+(note?"\n"+note:"");
      const id=j.id;
      mutateJob(id, x=>{ x.notes=x.notes||[]; x.notes.push({id:rid(), t:Date.now(), kind:isCall?"call":"email", text}); x.lastContact=Date.now(); x.attnAck=Math.max(x.attnAck||0, ageLevel(x)); });
      closeModal(); toast("Logged");
    });
  });
}

  const j=S.jobs[S.openJob]; if(!j) return;
  openModal(`<h2>Add expense</h2>
    ${photoPickerHTML("ex","receipt")}
    <div class="field"><label for="ex-amt">Amount</label><input class="input num" id="ex-amt" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" required></div>

    <div class="field" id="ex-subwrap"><label for="ex-sub">Paid to sub (optional)</label><select class="input" id="ex-sub" data-nofocus="1"><option value="">No sub</option>${contacts("subs").map(c=>`<option value="${esc(c.id)}">${esc(c.name)}${c.company?" · "+esc(c.company):""}</option>`).join("")}</select></div>
    <div class="grid2"><div class="field"><label for="ex-date">Date</label><input class="input" id="ex-date" type="date" value="${today()}" data-nofocus="1"></div>
    <div class="field"><label for="ex-desc">What for (optional)</label><input class="input" id="ex-desc" data-nofocus="1"></div></div>
    <div class="row"><button class="btn primary" id="ex-save">Save expense</button><button class="btn ghost" data-act="closeModal">Cancel</button></div>`, box=>{
    chipsPick(box,"cat");
    box.querySelector("#ex-sub").addEventListener("change", e=>{ if(e.target.value){ box.querySelectorAll('[data-pick="cat"]').forEach(x=>x.setAttribute("aria-pressed", String(x.dataset.v==="Sub labor"))); } });
    let photo=null;
    wirePhotoPicker(box, "ex", b=>{ photo=b; box.querySelector("#ex-amt").focus(); });
    box.querySelector("#ex-save").addEventListener("click", async ()=>{
      const amt=n(box.querySelector("#ex-amt").value);
      if(!amt){ box.querySelector("#ex-amt").focus(); toast("Type the amount"); return; }
      const btn=box.querySelector("#ex-save"); btn.disabled=true; btn.textContent="Saving…";
      const item={id:rid(), amount:amt, category:picked(box,"cat"), date:dateVal(box.querySelector("#ex-date").value), desc:box.querySelector("#ex-desc").value.trim(), assetId:null, drive:null, subContactId: box.querySelector("#ex-sub").value||null};
      const jobId=j.id;
      if(photo){
        try{ item.assetId = await storeAsset(photo, "image/jpeg", jobId); }
        catch(err){ toast(assetErr(err)+" Expense saved without photo."); }
      }
      await mutateJob(jobId, x=>{ x.expenses=x.expenses||[]; x.expenses.push(item); });
      closeModal(); toast("Expense added");
      if(item.assetId) fileToDrive(jobId, "expenses", item.id, photo, `Receipt ${new Date(item.date).toISOString().slice(0,10)} ${item.category} $${amt.toFixed(2)}.jpg`, "image/jpeg");
    });
  });
}

function receiptPDF(j, p, totals){
  const {jsPDF} = window.jspdf;
  const d = new jsPDF({unit:"pt", format:"letter"});
  const L=20, R=592, ink=[42,42,40], grey=[110,110,110], fill=[238,238,238];
  const tc = c => d.setTextColor(c[0],c[1],c[2]);
  const box = (x,y,w,h,f) => { d.setDrawColor(0,0,0); d.setLineWidth(0.6); if(f){ d.setFillColor(...fill); d.rect(x,y,w,h,"FD"); } else d.rect(x,y,w,h); };
  const amt = n(p.amount), bal = Math.max(0, totals.contract - totals.paid), paidOff = totals.contract>0 && bal < 0.005;
  const dstr = new Date(p.date).toLocaleDateString("en-US",{month:"2-digit",day:"2-digit",year:"numeric"});

  d.setFont("helvetica","normal"); d.setFontSize(8); tc(ink); d.text("RECEIPT", 548, 20, {align:"right"});
  d.text(String(p.receiptNo||""), 548, 30, {align:"right"});
  try{ d.addImage(RH_LOGO, "JPEG", 64, 30, 116, 74); }catch(e){}
  d.setFont("helvetica","bold"); d.setFontSize(7); d.text("Red Hammer Construction Group", 214, 68);
  d.setFont("helvetica","normal");
  ["910 Washington Blvd","Abilene, TX 79601","325-428-7085","www.redhammergroup.com"].forEach((t,i)=>d.text(t,214,78+i*9.5));
  d.setFont("helvetica","bold"); d.text("Regional Branch", 400, 68);
  d.setFont("helvetica","normal");
  ["910 Washington Blvd","Abilene, TX 79601","Ph: 325-428-7085"].forEach((t,i)=>d.text(t,400,78+i*9.5));

  /* customer + rep boxes */
  box(22,132,356,18); box(22,150,356,54);
  d.setFont("helvetica","bold"); d.setFontSize(6.5); d.text("Customer", 28, 143);
  d.setFont("helvetica","normal"); d.setFontSize(7);
  let cy=162; [j.name, j.address, j.phone, j.email].filter(Boolean).forEach(t=>{ d.splitTextToSize(String(t),340).slice(0,2).forEach(l=>{ if(cy<200){ d.text(l,28,cy); cy+=9.5; } }); });
  box(397,132,168,18); box(397,150,168,54);
  d.setFont("helvetica","bold"); d.setFontSize(6.5); d.text("Company Representative", 402, 143);
  d.setFont("helvetica","normal"); d.setFontSize(7);
  ["Gabriel Hawthorne","(325) 428-7085","Gabriel@redhammergroup.com"].forEach((t,i)=>d.text(t,402,162+i*9.5));

  /* line item table */
  const c1=440, c2=510, y0=233;
  box(L,y0,c1-L,20); box(c1,y0,c2-c1,20); box(c2,y0,R-c2,20);
  d.setFont("helvetica","bold"); d.setFontSize(7.5);
  d.text("Description",(L+c1)/2,y0+13,{align:"center"}); d.text("Quantity",(c1+c2)/2,y0+13,{align:"center"}); d.text("Price",(c2+R)/2,y0+13,{align:"center"});
  box(L,y0+20,R-L,20,true); d.setFontSize(8); d.text(tradeName(j.trade).toUpperCase(), L+8, y0+33);
  const lines = d.splitTextToSize(p.desc || (tradeName(j.trade)+" work"), c1-L-16).slice(0,6);
  const rh = Math.max(46, 18 + lines.length*10);
  const yi = y0+40;
  box(L,yi,c1-L,rh); box(c1,yi,c2-c1,rh); box(c2,yi,R-c2,rh);
  d.setFont("helvetica","normal"); d.setFontSize(7.5); tc(grey);
  lines.forEach((l,i)=>d.text(l, L+8, yi+16+i*10));
  tc(ink); d.text("1.00", (c1+c2)/2, yi+rh/2+3, {align:"center"});
  d.text(money(amt,1), R-8, yi+rh/2+3, {align:"right"});
  const ys = yi+rh;
  box(L,ys,c2-L,20,true); box(c2,ys,R-c2,20,true);
  d.setFont("helvetica","bold"); d.text("Subtotal", L+8, ys+13); d.text(money(amt,1), R-8, ys+13, {align:"right"});
  box(L,ys+20,c2-L,20); box(c2,ys+20,R-c2,20);
  d.text("Total", L+8, ys+33); d.text(money(amt,1), R-8, ys+33, {align:"right"});

  let y = ys+76;
  d.setFont("helvetica","normal"); d.setFontSize(7.5); d.text("Grand Total: "+money(amt,1), 22, y);
  y += 30; d.setFont("helvetica","bold"); d.setFontSize(10); d.text("PAYMENT", 22, y);
  y += 16;
  d.setFont("helvetica","normal"); d.setFontSize(7.5);
  const plist = p.list || [p];
  plist.forEach((q,i)=>{ if(i) y+=20;
    const qd=new Date(q.date).toLocaleDateString("en-US",{month:"2-digit",day:"2-digit",year:"numeric"});
    const pay = `${plist.length>1?ORD[i]+" payment: ":""}Paid by ${String(q.method||"").toLowerCase()} on ${qd}${q.note?" ("+q.note+")":""}`;
    box(22,y,440,20); box(462,y,116,20);
    d.text(d.splitTextToSize(pay,430)[0], 30, y+13); d.text(money(n(q.amount),1), 470, y+13); });
  if(plist.length>1){ y+=20; box(22,y,440,20); box(462,y,116,20); d.setFont("helvetica","bold"); d.text("Total paid", 30, y+13); d.text(money(amt,1), 470, y+13); d.setFont("helvetica","normal"); }
  if(!paidOff && totals.contract>0){ y+=20; box(22,y,440,20); box(462,y,116,20); d.text("Remaining balance", 30, y+13); d.text(money(bal,1), 470, y+13); }

  /* signatures */
  const sy = y + 70;
  try{ d.addImage(RH_SIG, "PNG", 84, sy-52, 40, 48); }catch(e){}
  d.setDrawColor(0,0,0); d.setLineWidth(0.6); d.line(20, sy, R, sy);
  d.setFontSize(7.5); tc(ink);
  d.text("Company Authorized Signature", 30, sy+12); d.text("Date", 185, sy+12); d.text(dstr, 185, sy-4);
  d.text("Customer Signature", 340, sy+12); d.text("Date", 495, sy+12);

  /* stamp */
  d.setFont("helvetica","normal"); d.setFontSize(26); tc(ink);
  const stamp = paidOff ? "PAID IN FULL" : "PAYMENT RECEIVED", gap = 36;
  const sw = d.getTextWidth(stamp), dw = d.getTextWidth(dstr), sx = 306 - (sw+gap+dw)/2;
  d.text(stamp, sx, sy+74); d.text(dstr, sx+sw+gap, sy+74);

  d.setFontSize(7); tc(grey); d.text("Thank you for your business.", 12, 780);
  tc(ink); d.text("Page 1 of 1", 580, 782, {align:"right"});
  return d.output("blob");
}
function addPayment(){
  const j=S.jobs[S.openJob]; if(!j) return;
  const c=calc(j);
  openModal(`<h2>Record payment</h2>
    <p class="muted" style="margin:0">${esc(j.name)} · balance due ${money(c.balance,1)}</p>
    <div class="field"><label for="py-amt">Amount received</label><input class="input num" id="py-amt" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00"></div>
    <div class="field"><span class="label" style="font-size:12px">Method</span><div class="chips">${PAY_METHODS.map((m,i)=>`<button type="button" class="chip" data-pick="m" data-v="${esc(m)}" aria-pressed="${i===(j.trade==="roofing"?3:0)}">${esc(m)}</button>`).join("")}</div></div>
    <div class="grid2"><div class="field"><label for="py-date">Date</label><input class="input" id="py-date" type="date" value="${today()}" data-nofocus="1"></div>
    <div class="field"><label for="py-note">Note (e.g. check #, first ACV check)</label><input class="input" id="py-note" data-nofocus="1"></div></div>
    <div class="field"><span class="label" style="font-size:12px">Photo of check or payment (optional)</span>${photoPickerHTML("pyp","check")}</div>
    <div class="row"><button class="btn primary" id="py-save">Save payment</button><button class="btn ghost" data-act="closeModal">Cancel</button></div>`, box=>{
    chipsPick(box,"m");
    let payPhoto=null; wirePhotoPicker(box, "pyp", b=>{ payPhoto=b; });
    box.querySelector("#py-save").addEventListener("click", async ()=>{
      const amt=n(box.querySelector("#py-amt").value);
      if(!amt){ toast("Type the amount"); box.querySelector("#py-amt").focus(); return; }
      const btn=box.querySelector("#py-save"); btn.disabled=true; btn.textContent="Saving…";
      const item={id:rid(), amount:amt, method:picked(box,"m"), date:dateVal(box.querySelector("#py-date").value), note:box.querySelector("#py-note").value.trim(), assetId:null, drive:null, photos:[]};
      const jobId=j.id;
      if(payPhoto){ try{ item.photos.push(await storeAsset(payPhoto, "image/jpeg", jobId)); }catch(e){ toast(assetErr(e)+" Payment saved without the photo."); } }
      await mutateJob(jobId, x=>{ x.payments=x.payments||[]; x.payments.push(item); x.notes=x.notes||[]; x.notes.push({id:rid(),t:Date.now(),kind:"system",text:`Payment ${money(amt,1)} by ${item.method.toLowerCase()}`}); });
      closeModal(); toast("Payment recorded");
    });
  });
}

function makeReceipt(){
  const j=S.jobs[S.openJob]; if(!j) return;
  const pays=[...(j.payments||[])].sort((a,b)=>(a.date||0)-(b.date||0));
  if(!pays.length){ toast("Record a payment first"); return; }
  const opts=pays.map((p,i)=>[String(i), `${ORD[i]||(i+1)+"th"} payment · ${money(n(p.amount),1)} · ${fdate(p.date)}`]);
  if(pays.length>1) opts.push(["all", `All payments (total) · ${money(pays.reduce((a,p)=>a+n(p.amount),0),1)}`]);
  openModal(`<h2>Make a receipt</h2>
    <div class="field"><label for="rc-which">Receipt for</label><select class="input" id="rc-which">${opts.map(([v,l])=>`<option value="${v}">${esc(l)}</option>`).join("")}</select></div>
    <div class="field"><label for="rc-desc">Description of work (one line on the receipt)</label><textarea class="input" id="rc-desc" style="min-height:64px" placeholder="e.g. Replaced roof with GAF Timberline HDZ, charcoal">${esc(j.workDesc||"")}</textarea></div>
    <div class="row"><button class="btn primary" id="rc-go">Make receipt</button><button class="btn ghost" data-act="closeModal">Cancel</button></div>`, box=>{
    box.querySelector("#rc-go").addEventListener("click", async ()=>{
      const desc=box.querySelector("#rc-desc").value.trim(); if(!desc){ toast("Add a description of the work"); box.querySelector("#rc-desc").focus(); return; }
      const which=box.querySelector("#rc-which").value, btn=box.querySelector("#rc-go"); btn.disabled=true; btn.textContent="Making receipt…";
      let no; if(S.mode==="owner"){ no=(S.settings.receiptNo||0)+1; await saveSettings({receiptNo:no}); no="RH-"+String(no).padStart(4,"0"); } else no="RH-"+Date.now().toString(36).toUpperCase().slice(-6);
      const cur=S.jobs[j.id], cc=calc(cur);
      let p, paidThrough, label;
      if(which==="all"){ const tot=pays.reduce((a,q)=>a+n(q.amount),0); p={amount:tot, date:pays.at(-1).date, method:"", list:pays, desc, receiptNo:no}; paidThrough=tot; label="All payments"; }
      else { const i=Number(which), q=pays[i]; p={...q, desc, receiptNo:no}; paidThrough=pays.slice(0,i+1).reduce((a,x)=>a+n(x.amount),0); label=(ORD[i]||(i+1)+"th")+" payment"; }
      let pdf; try{ pdf=receiptPDF(cur, p, {contract:cc.contract, paid:paidThrough}); }catch(e){ toast("Couldn't build the receipt"); btn.disabled=false; btn.textContent="Make receipt"; return; }
      const name=`${no} ${cur.name||"receipt"} (${label}).pdf`;
      let path=null; try{ path=await storeAsset(pdf, "application/pdf", cur.id); }catch(e){ toast(assetErr(e)); }
      await mutateJob(cur.id, x=>{ x.workDesc=desc; if(path){ x.docs=x.docs||[]; x.docs.push({id:rid(), name, type:"application/pdf", t:Date.now(), assetId:path, category:"Receipt"}); } x.notes=x.notes||[]; x.notes.push({id:rid(),t:Date.now(),kind:"system",text:`Receipt ${no} made (${label})`}); });
      closeModal(); toast("Receipt ready");
      try{ await shareOrSave(pdf, name, "Receipt "+no); }catch(e){}
    });
  });
}
function removeLead(id){
  const j=S.jobs[id||S.openJob]; if(!j) return; const canDel=can("delete"); if(!canDel && (j.lost||!can("edit"))){ toast("You don't have access to that"); return; }
  openModal(`<h2>${j.lost?"Delete forever":"Remove this lead"}</h2><p class="muted" style="margin:0">${esc(j.name||"")}${j.address?" · "+esc(j.address):""}</p>
    <div class="chips">${LOST_REASONS.map((r,i)=>`<button type="button" class="chip" data-pick="r" data-v="${esc(r)}" aria-pressed="${i===0}">${esc(r)}</button>`).join("")}</div>
    <div class="field"><label for="rm-note">Why? (required)</label><textarea class="input" id="rm-note" placeholder="What happened"></textarea></div>
    <div class="stack" style="gap:8px">
      ${(j.lost||!can("edit"))?"":`<button class="btn primary block" id="rm-lost">Move to Lost Leads</button><p class="small muted" style="margin:-4px 0 0">Keeps everything so you can call back later.</p>`}
      ${canDel?`<button class="btn block danger" id="rm-del" style="border-color:var(--red)">Delete forever</button><p class="small muted" style="margin:-4px 0 0">For dead files you'll never use. Removes the job, notes, money and files for good. Only the name and reason are kept in a deleted log.</p>`:""}
      <button class="btn ghost" data-act="closeModal">Cancel</button>
    </div>`, box=>{

    box.querySelector("#rm-lost")?.addEventListener("click",()=>{ const x0=reason(); if(!x0) return;
      mutateJob(j.id, x=>{ x.lost=true; x.lostReason=x0.r; x.lostAt=Date.now(); x.notes=x.notes||[]; x.notes.push({id:rid(),t:Date.now(),kind:"stage",text:"Marked lost: "+x0.r+"\n"+x0.note}); });
      closeModal(); S.openJob=null; render(); toast("Moved to Lost Leads"); });
    box.querySelector("#rm-del")?.addEventListener("click",()=>{ const x0=reason(); if(!x0) return;

      if(S.mode==="owner"){ const log=[{name:j.name, phone:j.phone, address:j.address, trade:j.trade, reason:x0.r, note:x0.note, at:Date.now()}, ...(S.settings.deletedLog||[])].slice(0,300); saveSettings({deletedLog:log}); }
      closeModal(); S.openJob=null; deleteJobDoc(j.id); toast("Deleted forever"); });
  });
