  deleteJob:()=>{
    const id=S.openJob, j=S.jobs[id];
    confirmBox("Delete "+(j.name||"this job")+"?", "This removes the job, its notes, expenses and payments from the CRM. Files already in Google Drive stay there. If you might call them back, use Mark as lost instead.", "Delete job", ()=>{
      S.openJob=null; deleteJobDoc(id); toast("Job deleted");
    });
  },
  dlReceipt:async b=>{
    const j=S.jobs[S.openJob], p=(j.payments||[]).find(x=>x.id===b.dataset.item); if(!p||!p.assetId) return;
    try{ const blob=await fileBlob(p.assetId); await shareOrSave(blob, `${p.receiptNo} ${j.name}.pdf`, `Receipt ${p.receiptNo}`); }
    catch(e){ toast("Couldn't load the receipt. Check your signal."); }
  },
  editPartner:b=>editPartner(b.dataset.id),
  signOut:async()=>{ await sb.auth.signOut(); },
  testAlarm:async()=>{ const ok=await pushAlert(S.settings.notifyTopic,{title:"Red Hammer CRM test alarm", message:"Alarms are working. You'll get one 1 hour before each appointment.", priority:5, tags:"alarm_clock"}); toast(ok?"Test alarm sent. Check your phone.":"Couldn't reach the alarm service. Check your signal."); },
  ptab:b=>{ S.ptab=b.dataset.v; S.openJob=null; render(); window.scrollTo(0,0); },
  forceUpdate:()=>location.replace(location.pathname+"?v="+Date.now()),
};
const NEED = {stage:"edit", nextStage:"edit", toggleSigned:"edit", toggleBuilt:"edit", setPath:"edit", ackAttn:"edit", addNote:"edit", logCall:"edit", logEmail:"edit",
  reopen:"edit", addPayPhoto:"payments", addPayment:"payments", makeReceipt:"payments", addExpense:"expenses", estToContract:"money", addPayout:"owner", editPartner:"owner",
  backupJson:"owner", backupCsv:"owner", testAlarm:"owner", editEmployee:"owner", editContact:"owner", subProfile:"owner", quickAdd:"addLeads"};
document.addEventListener("click", e=>{
  const a=e.target.closest("[data-act]"); if(!a) return;
  const need=NEED[a.dataset.act];
  if(need && !(need==="owner" ? S.mode==="owner" : can(need))){ e.preventDefault(); toast("You don't have access to that"); return; }
  if(a.dataset.act==="modalBg" && e.target!==a) return;
  const fn=ACT[a.dataset.act]; if(!fn) return;
  if(a.tagName!=="A") e.preventDefault();
  fn(a,e);
});

/* field edits on the job sheet */
document.addEventListener("change", e=>{
  const el=e.target;
  if(el.id==="pf-from"||el.id==="pf-to"){ if(!el.value) return; if(el.id==="pf-from") S.pFrom=el.value; else S.pTo=el.value; render(); return; }
  if(el.id==="docInput"){ uploadDoc(el); return; }
  if(el.id==="estInput"){ uploadDoc(el, "Estimate"); return; }
  if(el.dataset.esttotal && S.openJob){ const did=el.dataset.esttotal, v=el.value===""?null:n(el.value); mutateJob(S.openJob, x=>{ const d=(x.docs||[]).find(y=>y.id===did); if(d) d.total=v; }); return; }
  if(el.id==="srcYear"){ S.srcYear=Number(el.value); render(); return; }
  if(el.id==="srcFilter"){ S.srcFilter=el.value; render(); return; }
  if(el.id==="th1099"){ saveSettings({threshold1099:n(el.value)||2000}); toast("Threshold saved"); return; }
  if(el.dataset.contact && S.openJob){
    const kind=el.dataset.contact, field=el.dataset.cfield, id=S.openJob;
    const apply = cid => {
      if(field==="addSub"){ if(!cid) return; mutateJob(id, x=>{ x.subs=x.subs||[]; x.subs.push({id:rid(), contactId:cid, scope:"", price:null, date:""}); }); return; }
      mutateJob(id, x=>{ x[field]=cid||""; });
    };
    if(el.value==="__new"){ el.value=""; editContact(kind, "", nc=>apply(nc.id)); } else apply(el.value);
    return;
  }
  if(el.dataset.sub && S.openJob){
    const sid=el.dataset.sub, k=el.dataset.sk; let v=el.value; if(k==="price") v = v==="" ? null : n(v);
    mutateJob(S.openJob, x=>{ const a=(x.subs||[]).find(y=>y.id===sid); if(a) a[k]=v; }); return;
  }
  const f=el.dataset.field; if(!f || !S.openJob) return;
  if(!can(f==="contract"?"money":"edit")){ toast("You don't have access to change that"); render(); return; }
  let v=el.value;
  if(f==="contract") v = v==="" ? null : n(v);
  if(f==="appointmentAt") v = v ? new Date(v).getTime() : null;
  if(f==="splitPct") v = v==="" ? null : Math.min(100, Math.max(0, n(v)));
  const id=S.openJob;
  mutateJob(id, x=>{
    x[f]=v;
    if(f==="appointmentAt"){ setTimeout(sweepAlarms, 500); }
    if(f==="trade"){ if(!STAGES[v].includes(x.stage)) x.stage="Lead"; x.closedAt = x.stage===CLOSED[v] ? (x.closedAt||Date.now()) : null; }
  });
  if(f==="trade"){ S.trade=v; toast("Moved to the "+tradeName(v)+" board"); }
});
async function uploadDoc(input, category){
  const files=[...(input.files||[])]; input.value="";
  for(const f of files) await uploadOneDoc(f, category);
}
async function uploadOneDoc(f, category){
  const id=S.openJob; if(!id || !f) return;
  let blob=f, type=f.type;
  if(type.startsWith("image/")){ blob=await compressImage(f); type=blob.type||"image/jpeg"; }
  if(!ASSET_TYPES.includes(type)){ toast(`${f.name}: use a photo or PDF.`); return; }
  toast("Uploading…");
  const item={id:rid(), name:f.name.replace(/\.[^.]+$/,"")+(type==="image/jpeg"&&!/\.jpe?g$/i.test(f.name)?".jpg":f.name.match(/\.[^.]+$/)?.[0]||""), type, t:Date.now(), assetId:null, drive:null, category:category||""};
  try{ item.assetId = await storeAsset(blob, type, id); }catch(e){ toast(assetErr(e)); return; }
  await mutateJob(id, x=>{ x.docs=x.docs||[]; x.docs.push(item); });
  toast(`Saved ${item.name}`);
  fileToDrive(id, "docs", item.id, blob, item.name, type);
}

/* drag files onto the Files tab */
document.addEventListener("dragover", e=>{
  if(!e.dataTransfer || ![...e.dataTransfer.types].includes("Files")) return;
  e.preventDefault(); const z=e.target.closest?.("#docDrop,#estDrop"); document.querySelectorAll(".dropzone.over").forEach(x=>x!==z&&x.classList.remove("over")); if(z) z.classList.add("over");
});
document.addEventListener("dragleave", e=>{ const z=e.target.closest?.("#docDrop,#estDrop"); if(z && !z.contains(e.relatedTarget)) z.classList.remove("over"); });
document.addEventListener("drop", async e=>{
  if(!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
  if(e.target.closest && e.target.closest("#modal")){ e.preventDefault(); return; }
  e.preventDefault(); document.querySelectorAll(".dropzone.over").forEach(x=>x.classList.remove("over"));
  if(!S.openJob || S.mode!=="owner"){ return; }
  const est = !!e.target.closest?.("#estDrop");
  if(!est && S.jobTab!=="files" && S.jobTab!=="info"){ S.jobTab="files"; render(); }
  for(const f of [...e.dataTransfer.files]) await uploadOneDoc(f, est?"Estimate":"");
});

/* lost search: update the list only, keep focus */
document.addEventListener("input", e=>{
  if(e.target.id==="jobSearch"){ S.search=e.target.value; const a=$("#boardArea"); if(a) a.innerHTML=boardArea(); return; }
  if(e.target.id==="lostSearch"){ S.lostQuery=e.target.value; const l=$("#lostList"); if(l) l.innerHTML=lostRows(); }
});

/* drag and drop between columns (computer) */
document.addEventListener("dragstart", e=>{ const c=e.target.closest?.(".card"); if(c){ e.dataTransfer.setData("text/plain", c.dataset.id); e.dataTransfer.effectAllowed="move"; } });
document.addEventListener("dragover", e=>{ const col=e.target.closest?.(".col"); if(col){ e.preventDefault(); document.querySelectorAll(".col.over").forEach(x=>x!==col&&x.classList.remove("over")); col.classList.add("over"); } });
document.addEventListener("dragleave", e=>{ const col=e.target.closest?.(".col"); if(col && !col.contains(e.relatedTarget)) col.classList.remove("over"); });

});

/* after tapping Call / Email, ask how it went when they come back */
function checkReturn(){
  const p=S.pendingContact; if(!p || document.visibilityState!=="visible") return;
  if(Date.now()-p.t < 1500) return;
  S.pendingContact=null;
  if(S.openJob===p.id && !$("#modal").innerHTML) contactLog(p.kind);
}
document.addEventListener("visibilitychange", ()=>setTimeout(checkReturn, 300));
window.addEventListener("focus", ()=>setTimeout(checkReturn, 300));

/* ---------- appointment alarms & alerts (ntfy push to Gabriel's phone) ---------- */
const ascii = t => String(t||"").normalize("NFKD").replace(/[^\x20-\x7E]/g,"").slice(0,120);
const fdtLong = t => new Date(t).toLocaleString("en-US",{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
async function pushAlert(topic, {title, message, at, priority=4, tags="bell"}){
  if(!topic) return false;
  const h={"Title":ascii(title), "Priority":String(priority), "Tags":tags, "Click":location.origin+location.pathname};
  if(at) h["At"]=String(Math.floor(at/1000));
  try{ const r=await fetch(NTFY+encodeURIComponent(topic), {method:"POST", headers:h, body:message}); return r.ok; }catch(e){ return false; }
}
const MAX_AHEAD = 71*3600e3; /* the push service holds scheduled alerts up to ~3 days */
function alarmPlan(appt){
  const now=Date.now(); if(!appt || appt < now+60e3) return null;
  const at=Math.max(appt-3600e3, now+15e3);
  return (at-now > MAX_AHEAD) ? null : at;
}
async function scheduleAlarm(topic, j){
  const at=alarmPlan(j.appointmentAt); if(!at) return false;
  return pushAlert(topic, {title:`Appointment in 1 hour: ${j.name||"customer"}`, message:`${fdtLong(j.appointmentAt)}\n${j.address||""}${j.phone?"\n"+j.phone:""}${srcLabel(j)==="Tony"?"\nLead from Tony":""}`, at, priority:5, tags:"alarm_clock"});
}
let sweeping=false;
async function sweepAlarms(){
  if(S.mode!=="owner" || sweeping || !S.settings.notifyTopic) return; sweeping=true;
  try{
    for(const j of Object.values(S.jobs)){
      if(j.lost || !j.appointmentAt || j.alarmFor===j.appointmentAt || !alarmPlan(j.appointmentAt)) continue;
      if(await scheduleAlarm(S.settings.notifyTopic, j)) await mutateJob(j.id, x=>{ x.alarmFor=x.appointmentAt; });
    }
  }finally{ sweeping=false; }
}
setInterval(()=>{ sweepAlarms(); sweepReminders(); }, 15*60e3);
async function syncPartnerAccounts(){
  if(S.mode!=="owner") return;
  const rows=S.settings.partners.filter(p=>p.email).map(p=>({email:String(p.email).trim().toLowerCase(), partner_id:p.id, name:p.name, pct:n(p.pct), basis:p.basis||"profit", notify_topic:S.settings.notifyTopic||null, updated_at:new Date().toISOString()}));
  if(rows.length){ const {error}=await sb.from("partner_accounts").upsert(rows); if(error) console.warn("partner sync", error.message); }
}

/* ---------- boot ---------- */
let channel=null;
async function loadAll(){
  if(!S.mode){
    const email=String(session?.user?.email||"").toLowerCase();
    if(email===OWNER_EMAIL) S.mode="owner";
    else{
      const {data}=await sb.from("partner_accounts").select("*").eq("email", email).maybeSingle();
      if(data){ S.mode="partner"; S.me=data; S.isOwner=false; S.settings={...DEFAULT_SETTINGS, partners:[{id:data.partner_id, name:data.name||"Partner", pct:n(data.pct), basis:data.basis||"profit"}]}; }
      else{
        const {data:emp}=await sb.from("employees").select("*").eq("email", email).maybeSingle();
        if(emp && emp.active){ S.mode="employee"; S.me=emp; S.isOwner=false; S.me.perms=emp.perms||{}; }
        else S.mode="none";
      }
    }
  }
  if(S.mode==="none"){ S.ready=true; render(); return; }
  if(S.mode==="employee"){
    const [jr, st] = await Promise.all([ sb.from("jobs").select("id,data"), sb.from("settings").select("data").eq("id",1).maybeSingle() ]);
    if(jr.error){ S.dbOk=false; S.dbErr=jr.error.message; S.ready=true; render(); return; }
    const m={}; (jr.data||[]).forEach(r=>{ m[r.id]={...r.data, id:r.id}; }); S.jobs=m;
    if(st.data && st.data.data) S.settings={...DEFAULT_SETTINGS, ...st.data.data};
    if(!myTrades().some(([k])=>k===S.trade) && myTrades().length) S.trade=myTrades()[0][0];
    S.ready=true; S.dbOk=true; S.dbErr=""; render(); sweepReminders(); return;
  }
  if(S.mode==="partner"){
    const jr = await sb.from("jobs").select("id,data").eq("partner_id", S.me.partner_id);
    if(jr.error){ S.dbOk=false; S.dbErr=jr.error.message; S.ready=true; render(); return; }
    const m={}; (jr.data||[]).forEach(r=>{ m[r.id]={...r.data, id:r.id}; }); S.jobs=m; S.ready=true; S.dbOk=true; S.dbErr=""; render(); return;
  }
  const [jr, st] = await Promise.all([ sb.from("jobs").select("id,data,partner_id"), sb.from("settings").select("data").eq("id",1).maybeSingle() ]);
  if(jr.error){ S.dbOk=false; S.dbErr=jr.error.message||String(jr.error.code||"unknown"); S.ready=true; render(); return; }
  S.dbErr="";
  const m={}, fix=[]; (jr.data||[]).forEach(r=>{ const j={...r.data, id:r.id}; m[r.id]=j; if(((partnerFor(j)||{}).id||null)!==(r.partner_id||null)) fix.push(j); });
  S.jobs=m; if(st.data && st.data.data) S.settings={...DEFAULT_SETTINGS, ...st.data.data};
  S.ready=true; S.dbOk=true; render();
  /* Other board renamed stages: old Complete -> In Progress, old Paid -> Complete */
  const mig=Object.values(S.jobs).filter(j=>j.trade==="other" && !j.stagesV2);
  for(const j of mig){ await mutateJob(j.id, x=>{ if(x.stage==="Complete") x.stage="In Progress"; else if(x.stage==="Paid") x.stage="Complete"; x.closedAt = x.stage==="Complete" ? (x.closedAt||Date.now()) : null; x.stagesV2=true; }); }
  /* keep each job's partner tag in step with its lead source (controls what the partner can see) */
  if(fix.length) await sb.from("jobs").upsert(fix.map(row));
  if(!S.settings.notifyTopic){ await saveSettings({notifyTopic:"rh-"+Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(36).padStart(2,"0")).join("").slice(0,20)}); syncPartnerAccounts(); }
  sweepAlarms(); sweepReminders();
  const lb=S.settings.lastBackupAt; if(!S.nudged && Object.keys(S.jobs).length && (!lb || Date.now()-lb>35*864e5)){ S.nudged=true; setTimeout(()=>toast("Reminder: download a backup in Settings"), 2500); }
}
function subscribe(){
  if(channel) sb.removeChannel(channel);
  channel = sb.channel("crm")
    .on("postgres_changes", {event:"*", schema:"public", table:"jobs"}, p=>{
      if(p.eventType==="DELETE"){ delete S.jobs[p.old.id]; }
      else if(p.new && p.new.data){ S.jobs[p.new.id]={...p.new.data, id:p.new.id};
        if(S.mode==="owner" && p.eventType==="INSERT" && p.new.data.submittedBy){ toast(`New appointment from ${p.new.data.submittedBy}: ${p.new.data.name||""}`); sweepAlarms(); } }
      renderSoon();
    })
    .on("postgres_changes", {event:"*", schema:"public", table:"settings"}, p=>{ if(p.new && p.new.data){ S.settings={...DEFAULT_SETTINGS, ...p.new.data}; renderSoon(); } })
    .subscribe();
}
sb.auth.onAuthStateChange((ev, sess)=>{
  const was = !!session; session = sess; S.authReady=true;
  if(sess && !was){ S.ready=false; render(); setTimeout(()=>{ loadAll(); subscribe(); }, 0); }
  if(!sess){ S.jobs={}; S.ready=false; S.openJob=null; S.employees=null; S.mode=""; S.me=null; S.ptab="new"; S.isOwner=true; S.settings={...DEFAULT_SETTINGS}; if(channel){ sb.removeChannel(channel); channel=null; } render(); }
});
window.addEventListener("online", ()=>{ if(session){ S.dbOk=true; loadAll(); } });
window.addEventListener("offline", ()=>{ S.dbOk=false; renderSoon(); });
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible"){ if(session) loadAll(); checkUpdate(); } });
/* tell the user when a newer version of the app is online */
async function checkUpdate(){
  try{
    const t = await (await fetch("./index.html?check="+Date.now(), {cache:"no-store"})).text();
    const m = t.match(/const APP_VERSION = "([^"]+)"/);
    if(m && m[1]!==APP_VERSION && !$("#updbar")){
      const bar=document.createElement("div"); bar.id="updbar"; bar.className="toast"; bar.style.bottom="calc(80px + env(safe-area-inset-bottom,0px))";
      bar.innerHTML=`A new version is ready. <button class="btn small" style="margin-left:8px">Update now</button>`;
      bar.querySelector("button").onclick=()=>location.replace(location.pathname+"?v="+Date.now());
      document.body.appendChild(bar);
    }
  }catch(e){}
}
setTimeout(checkUpdate, 3000); setInterval(checkUpdate, 10*60e3);
render();
})();
